{# Shared input field markup. Used by module.html and module-specific views. #}
{% macro render_field(field, values) -%}
<div class="field"><label for="{{ field.name }}">{{ field.label }}</label>{% if field.kind=='select' %}<select id="{{ field.name }}" name="{{ field.name }}">{% for choice in field.choices %}<option {% if values.get(field.name)==choice %}selected{% endif %}>{{ choice }}</option>{% endfor %}</select>{% else %}<input id="{{ field.name }}" name="{{ field.name }}" type="{{ field.kind }}" value="{{ values.get(field.name,'') }}" required {% if field.kind=='number' %}min="{{ field.minimum }}" max="{{ field.maximum }}" step="{{ field.step }}" inputmode="decimal"{% else %}maxlength="120"{% endif %} {% if field.help %}aria-describedby="help-{{ field.name }}"{% endif %}>{% endif %}{% if field.help %}<small id="help-{{ field.name }}">{{ field.help }}</small>{% endif %}</div>
{%- endmacro %}
